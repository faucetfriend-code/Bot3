[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "2.1.0"
description = "Trading bot with multiple strategies"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_bot_v2*"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running but deterministic; stays in the default run",
    "perf: wall-clock measurement of the machine rather than of the code. Excluded from the default run because a test that fails randomly teaches the reader to ignore failures. Run deliberately, on a quiet machine, with: pytest -m perf",
]
# Keep the default suite trustworthy: every failure in it should mean
# something. Timing-dependent tests opt in via -m perf, which overrides
# this because command-line args are applied after addopts.
addopts = "-m 'not perf'"
[tool.ruff]
# CI (.github/workflows/ci.yml) runs `ruff check` and `ruff format --check`
# on trading_bot_v2/. The rule set is declared here so a newer ruff release
# cannot silently widen it: unpinned ruff 0.16 expanded the defaults and
# reported 5000 errors on a tree that passed 0.14 with zero. The version is
# pinned in CI to the one the tree is formatted with.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# CI (.github/workflows/ci.yml, job "Type Check") runs `mypy --strict
# trading_bot_v2/` against this configuration and is blocking. `strict = true`
# here keeps a bare `mypy trading_bot_v2/` equivalent to the CI command.
python_version = "3.11"
strict = true
warn_unreachable = false
show_error_codes = true
pretty = false
# The test suite is owned by a separate workstream and is not held to the
# strict contract: it leans on MagicMock, SimpleNamespace and untyped
# fixtures by design. `mypy trading_bot_v2/` therefore skips it. Run
# `mypy trading_bot_v2/tests/` explicitly to see its state.
exclude = ["^trading_bot_v2/tests/"]

# Third-party packages that ship neither inline types nor a stubs package.
# `ignore_missing_imports` only silences the import line; the imported names
# become Any and every use is still checked. Packages with stubs (pandas,
# requests, psycopg2, psutil, scipy) are installed by CI instead.
[[tool.mypy.overrides]]
module = [
    "hmmlearn.*",
    "joblib",
    "sklearn.*",
]
ignore_missing_imports = true
