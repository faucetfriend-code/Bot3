[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "2.1.0"
description = "Trading bot with multiple strategies"
requires-python = ">=3.11"
# Runtime dependencies are still installed from trading_bot_v2/requirements.txt
# (the Dockerfile and run_bot.bat both read it); this list stays empty on
# purpose so `pip install -e .` does not pull a second copy of them.
dependencies = []

# Development tool pins. CI (.github/workflows/ci.yml) installs exactly one
# of these groups per job, so the version a job runs is decided here and
# nowhere else. Bump a pin here and CI follows.
#   pip install -e ".[dev]"   # everything
[project.optional-dependencies]
lint = [
    "ruff==0.14.14",
    "black==26.10.0",
]
typing = [
    "mypy==2.4.0",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # The suite needs these two but trading_bot_v2/requirements.txt does not
    # list them: test_connection_manager_standalone.py marks its tests
    # @pytest.mark.asyncio (pytest 9 fails unhandled coroutines outright),
    # and test_performance.py / test_profiler_benchmark.py import psutil.
    "pytest-asyncio==1.4.0",
    "psutil==7.2.2",
]
security = [
    "bandit==1.9.4",
]
dev = [
    "trading-bot[lint,typing,test,security]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_bot_v2*"]

[tool.pytest.ini_options]
# The suite imports `trading_bot_v2.*` absolutely. Putting the repo root on
# sys.path makes a bare `pytest` work from a fresh checkout without
# `pip install -e .` or `python -m pytest` (CI on main was collecting zero
# tests for exactly this reason until 2026-10-09).
pythonpath = ["."]
testpaths = ["trading_bot_v2/tests"]
markers = [
    "slow: long-running but deterministic; stays in the default run",
    "perf: wall-clock measurement of the machine rather than of the code. Excluded from the default run because a test that fails randomly teaches the reader to ignore failures. Run deliberately, on a quiet machine, with: pytest -m perf",
]
# Keep the default suite trustworthy: every failure in it should mean
# something. Timing-dependent tests opt in via -m perf, which overrides
# this because command-line args are applied after addopts.
addopts = "-m 'not perf'"

[tool.coverage.run]
source = ["trading_bot_v2"]
omit = [
    "trading_bot_v2/tests/*",
    "trading_bot_v2/tmpclaude-*/*",
]

[tool.coverage.report]
precision = 1
# Leave files with no executable statements (empty __init__.py) out of the table.
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

# Formatting: the gate is `ruff format --check` (see [tool.ruff]). Black is
# configured identically so a local `black` run lands close to what the gate
# accepts, but Black's stable style and ruff format are not byte-identical
# (ruff hugs multi-line strings inside call parentheses, Black parenthesises
# multi-line ternaries, and so on), so Black is deliberately NOT run in CI.
# If you format with Black, run `ruff format` afterwards; the gate decides.
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
# CI (.github/workflows/ci.yml) runs `ruff check` and `ruff format --check`
# on trading_bot_v2/. The rule set is declared here so a newer ruff release
# cannot silently widen it: unpinned ruff 0.16 expanded the defaults and
# reported 5000 errors on a tree that passed 0.14 with zero. The version is
# pinned (optional-dependencies.lint above) to the one the tree is formatted
# with.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Explicit so a future ruff default change cannot silently reformat the tree.
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Bandit reads this via `bandit -c pyproject.toml` (CI and the pre-commit
# hook). Tests are excluded: assert statements and hard-coded test fixtures
# are the whole point there.
[tool.bandit]
exclude_dirs = ["trading_bot_v2/tests"]
