# Prometheus Configuration for Bot 3 Trading System

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Bot metrics
  - job_name: 'trading-bot'
    static_configs:
      - targets: ['bot:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
