# Bot 3 Trading System - Docker Compose
# Development and production configuration

version: '3.8'

services:
  # Trading Bot API Server
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: trading-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./trading_bot_v2/backtesting/data:/app/trading_bot_v2/backtesting/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - bot-network

  # Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - bot-network

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - bot-network

  # TimescaleDB (time-series database) - Phase 2
  # Uncomment when ready to migrate from SQLite
  # timescaledb:
  #   image: timescale/timescaledb:latest-pg16
  #   container_name: timescaledb
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - timescale-data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_DB=trading_bot
  #     - POSTGRES_USER=bot_user
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
  #   networks:
  #     - bot-network

volumes:
  prometheus-data:
  grafana-data:
  # timescale-data:

networks:
  bot-network:
    driver: bridge
